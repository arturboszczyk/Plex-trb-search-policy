<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening CNC Extension...</title>
</head>


<body>
    <script>
        const alertAWB = (title, options = {}) => {
            const { message = "", showButton = true, emailArtur = false, hideAfter = 0, hidePreviousMessages = false } = options;
        
            if (hidePreviousMessages) {
                document.querySelectorAll('#AWB-custom-alert-modal').forEach(m => m.remove());
            }
        
            const existingModal = document.getElementById('AWB-custom-alert-modal');
            const modal = document.createElement('div');
            modal.id = 'AWB-custom-alert-modal';
            modal.style.position = 'fixed';
            modal.style.top = existingModal ? '60%' : '35%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.background = 'rgba(249, 245, 42, 1)';
            modal.style.border = '2px solid black';
            modal.style.padding = '15px';
            modal.style.zIndex = '999999';
            modal.style.fontFamily = 'sans-serif';
            modal.style.minWidth = '150px';
            modal.style.boxShadow = '0 4px 15px rgba(0,0,0,0.3)';
        
            const isLong = message.length > 200;
            const messageStyle = `
                    margin:0 0 15px; 
                    font-size: 0.9em; 
                    text-align: left; 
                    white-space: normal;
                    user-select: text;
                    ${isLong ? 'max-height:150px; overflow-y:auto; display:block;' : ''}
                `;
        
            let modalHTML = `
                    <h3 style="margin:0 0 10px;font-size:1.2em; text-align: center;font-weight: bold;">
                        ${title.replace(/\n/g, "<br>")}
                    </h3>
                    <div style="${messageStyle}">
                        ${message.replace(/\n/g, "<br>")}
                    </div>
                `;
        
            if (showButton) {
                modalHTML += `<button id="closeAlert" style="padding:5px 10px;">OK</button>`;
            } else {
                modal.style.cursor = 'pointer';
                modal.onclick = () => modal.remove();
            }
        
            modal.innerHTML = modalHTML;
            document.body.appendChild(modal);
        
            if (showButton) {
                document.getElementById('closeAlert').onclick = () => modal.remove();
            }
        
            if (hideAfter > 0) {
                setTimeout(() => {
                    if (modal.parentNode) modal.remove();
                }, hideAfter);
            }
        }//∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎∎

        
        window.onload = () => {
            alertAWB("Opening CNC Instructions Extension...", {
                message: "",
                showButton: false
            });
    
            setTimeout(() => {
                window.location.href =
                    `chrome-extension://${extensionId}/instructions.html${currentParams}`;
            }, 2000);   // wait 1 second
        
            const extensionId = "jemdcbobfhegaidaaanachognmhcdcid";
            const currentParams = window.location.search;
        
            console.log(`CNC.HTML url='chrome-extension://${extensionId}/instructions.html${currentParams}'`);
        
            window.location.href =
                `chrome-extension://${extensionId}/instructions.html${currentParams}`;
        };
        
    </script>
</body>
</html>
